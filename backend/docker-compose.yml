name: chessoc

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chessoc
      POSTGRES_USER: chessoc
      POSTGRES_PASSWORD: chessoc
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chessoc -d chessoc"]
      interval: 3s
      timeout: 3s
      retries: 20

  engine:
    profiles: [dev-engine]
    build: ./engine
    environment:
      ENGINE_PORT: "9100"
      # Use the real vector64 binary instead of the dev engine:
      #   ENGINE_CMD: /opt/engine/bin/ChessEngine-validator
    # volumes:
    #   - /path/to/vector64/bin:/opt/engine/bin:ro
    ports:
      - "9100:9100"

  server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CHESSOC_HTTP_PORT: "8080"
      CHESSOC_WS_PORT: "8081"
      CHESSOC_VALIDATOR_CMD: /opt/vector64/vector64-validator
      CHESSOC_SEARCH_CMD: /opt/vector64/vector64-all
      CHESSOC_VALIDATOR_WORKERS: "2"
      CHESSOC_SEARCH_WORKERS: "${CHESSOC_SEARCH_WORKERS:-2}"
      CHESSOC_DB_URL: jdbc:postgresql://postgres:5432/chessoc
      CHESSOC_DB_USER: chessoc
      CHESSOC_DB_PASSWORD: chessoc
      CHESSOC_TOKEN_SECRET: "${CHESSOC_TOKEN_SECRET:-dev-secret-change-me}"
    ports:
      - "${CHESSOC_HTTP_HOST_PORT:-8080}:8080"
      - "8081:8081"

  # Production web build. For local UI work run `npm run dev` in ../web instead.
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: /api
        NEXT_PUBLIC_WS_BASE: ""
    depends_on:
      - server
    # Host 3001 so the prod build can run alongside `npm run dev` (host 3000).
    ports:
      - "3001:3000"

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - web
      - server
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

  tunnel:
    profiles: [public]
    image: cloudflare/cloudflared:latest
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    command: ${CLOUDFLARE_TUNNEL_COMMAND:-tunnel --protocol http2 --no-autoupdate --url http://caddy:80}
    depends_on:
      - caddy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_config:
